%YAML 1.2
---
$id: http://devicetree.org/schemas/net/brcm,bcm6858-gpon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM6858 GPON ONU MAC and WAN SerDes (DRAFT, hh-pon)

description: |
  GPON (ITU-T G.984) ONU MAC of the BCM6858 together with the WAN-top block
  that hosts the Eagle ONU10G SerDes PMI bridge, laser-burst-enable forcing
  and the WAN interface select. Register window 0x80144000-0x80157fff covers
  WAN top (0x80144000), GPON TX (0x80148000) and GPON RX (0x80150000);
  see HH4000 docs/13. The NG-PON (XGS) MAC at 0x80160000/0x80168000 is not
  covered by this draft.
  Downstream PLOAMs and all GEM traffic pass through the XRDP Runner
  (docs/14), referenced by brcm,runner.

maintainers:
  - TBD

properties:
  compatible:
    const: brcm,bcm6858-gpon

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: GPON TX MAC (TXISR0..2)
      - description: GPON RX MAC (GRXISR)

  interrupt-names:
    items:
      - const: tx
      - const: rx

  tx-enable-gpios:
    maxItems: 1
    description: Optics transmitter power enable (HH4000 GPIO57, active low).

  gpon-select-gpios:
    maxItems: 1
    description: |
      Selects the GPON (M02099) rather than the XGS-PON (M02180) optics path
      behind the shared BOSA (HH4000 GPIO60, high = GPON).

  rogue-onu-gpios:
    maxItems: 1
    description: Rogue-ONU detect input (HH4000 GPIO56) [inferred].

  brcm,runner:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: XRDP Runner node providing the PON datapath.

  nvmem-cells:
    maxItems: 1
    description: Optional ONU serial number cell (otherwise module parameter).

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/gpio/gpio.h>
    pon@80144000 {
        compatible = "brcm,bcm6858-gpon";
        reg = <0x80144000 0x14000>;
        interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 99 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "tx", "rx";
        tx-enable-gpios = <&gpio1 25 GPIO_ACTIVE_LOW>;   /* GPIO57 */
        gpon-select-gpios = <&gpio1 28 GPIO_ACTIVE_HIGH>; /* GPIO60 */
        brcm,runner = <&xrdp>;
    };
